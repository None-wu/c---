<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Ensure Windows system font directory is scanned -->
  <dir>C:\Windows\Fonts</dir>

  <!-- Add Segoe UI Emoji as fallback for all font patterns -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>Segoe UI Emoji</string>
    </edit>
  </match>
</fontconfig>
